    EJS_onSaveState = function (data) {

        let stateBlob = new Blob([data.state], { type: "application/octet-stream" });
        let screenshotBlob = new Blob([data.screenshot], { type: "image/png" });

        let formData = new FormData();
        formData.append("state", stateBlob, "save.state");
        formData.append("screenshot", screenshotBlob, "screenshot.png"); // Opcional

        // Enviar o arquivo para o backend via API
        fetch("http://localhost/api/v1/save", {
            method: "POST",
            body: formData
        })
            .then(response => response.json())
            .then(data => {
                console.log("Upload feito com sucesso:", data);
            })
            .catch(error => {
                console.error("Erro no upload:", error);
            });
    };

            const toData = (data, rv) => {
                if (!(data instanceof ArrayBuffer) && !(data instanceof Uint8Array) && !(data instanceof Blob)) return null;
                if (rv) return true;
                return new Promise(async (resolve) => {
                    if (data instanceof ArrayBuffer) {
                        resolve(new Uint8Array(data));
                    } else if (data instanceof Uint8Array) {
                        resolve(data);
                    } else if (data instanceof Blob) {
                        resolve(new Uint8Array(await data.arrayBuffer()));
                    }
                    resolve();
                })
            };

            const downloadFile = (path, progressCB, notWithPath, opts) => {
                return new Promise(async cb => {
                    const data = toData(path);//check other data types
                    if (data) {
                        data.then((game) => {
                            if (opts.method === 'HEAD') {
                                cb({ headers: {} });
                            } else {
                                cb({ headers: {}, data: game });
                            }
                        })
                        return;
                    }
                    const basePath = notWithPath ? '' : this.config.dataPath;
                    path = basePath + path;
                    if (!notWithPath && this.config.filePaths && typeof this.config.filePaths[path.split('/').pop()] === "string") {
                        path = this.config.filePaths[path.split('/').pop()];
                    }
                    let url;
                    try { url = new URL(path) } catch (e) { };
                    if (url && !['http:', 'https:'].includes(url.protocol)) {
                        //Most commonly blob: urls. Not sure what else it could be
                        if (opts.method === 'HEAD') {
                            cb({ headers: {} });
                            return;
                        }
                        try {
                            let res = await fetch(path)
                            if ((opts.type && opts.type.toLowerCase() === 'arraybuffer') || !opts.type) {
                                res = await res.arrayBuffer();
                            } else {
                                res = await res.text();
                                try { res = JSON.parse(res) } catch (e) { }
                            }
                            if (path.startsWith('blob:')) URL.revokeObjectURL(path);
                            cb({ data: res, headers: {} });
                        } catch (e) {
                            cb(-1);
                        }
                        return;
                    }
                    const xhr = new XMLHttpRequest();
                    if (progressCB instanceof Function) {
                        xhr.addEventListener('progress', (e) => {
                            const progress = e.total ? ' ' + Math.floor(e.loaded / e.total * 100).toString() + '%' : ' ' + (e.loaded / 1048576).toFixed(2) + 'MB';
                            progressCB(progress);
                        });
                    }
                    xhr.onload = function () {
                        if (xhr.readyState === xhr.DONE) {
                            let data = xhr.response;
                            if (xhr.status.toString().startsWith("4") || xhr.status.toString().startsWith("5")) {
                                cb(-1);
                                return;
                            }
                            try { data = JSON.parse(data) } catch (e) { }
                            cb({
                                data: data,
                                headers: {
                                    "content-length": xhr.getResponseHeader('content-length')
                                }
                            });
                        }
                    }
                    if (opts.responseType) xhr.responseType = opts.responseType;
                    xhr.onerror = () => cb(-1);
                    xhr.open(opts.method, path, true);
                    xhr.send();
                })
            };

            downloadFile('http://localhost/api/v1/load', (progress) => {
                // this.textElem.innerText = this.localization("Download Game State") + progress;
            }, true, { responseType: "arraybuffer", method: "GET" }).then((res) => {
                // if (res === -1) {
                //     this.startGameError(this.localization('Network Error'));
                //     return;
                // }
                // this.on("start", () => {
                setTimeout(() => {
                    window.EJS_emulator.gameManager.functions.loadState(new Uint8Array(res.data));
                }, 10);
                // })
                // resolve();
            });

        });
    };
