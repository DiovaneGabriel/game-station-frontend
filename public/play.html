<style>
    body,
    html {
        margin: 0;
        padding: 0;
    }

    .save-modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(5, 10, 25, 0.55);
        backdrop-filter: blur(3px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .save-modal-overlay.open {
        display: flex;
    }

    .save-modal {
        width: min(540px, 92vw);
        max-height: 82vh;
        background: #0f172a;
        color: #e2e8f0;
        border-radius: 14px;
        box-shadow: 0 18px 48px rgba(0, 0, 0, 0.35);
        overflow: hidden;
        border: 1px solid #1f2a44;
        display: flex;
        flex-direction: column;
    }

    .save-modal header {
        padding: 14px 18px;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
    }

    .save-modal header h3 {
        margin: 0;
        font-size: 18px;
        letter-spacing: 0.2px;
    }

    .save-modal header button {
        background: transparent;
        border: none;
        color: #94a3b8;
        font-size: 18px;
        cursor: pointer;
    }

    .save-modal .content {
        padding: 16px 18px 12px;
        overflow-y: auto;
        flex: 1;
        display: grid;
        gap: 10px;
    }

    .save-card {
        background: #111827;
        border: 1px solid #1f2937;
        border-radius: 10px;
        padding: 12px 14px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        cursor: pointer;
        transition: border-color 120ms ease, transform 120ms ease;
    }

    .save-card:hover {
        border-color: #38bdf8;
        transform: translateY(-1px);
    }

    .save-card .meta {
        display: flex;
        flex-direction: column;
        gap: 4px;
    }

    .save-card .meta .title {
        font-weight: 600;
        color: #e2e8f0;
    }

    .save-card .meta .subtitle {
        font-size: 12px;
        color: #94a3b8;
    }

    .save-card .badge {
        padding: 6px 10px;
        border-radius: 999px;

        transition: border-color 120ms ease, background 120ms ease;
    }

    .save-modal .footer button.primary {
        background: #2563eb;
        border-color: #1d4ed8;
        color: #e0f2fe;
    }

    .save-modal .footer button:hover {
        border-color: #38bdf8;
    }

    .save-empty,
    .save-loading {
        padding: 26px 10px;
        text-align: center;
        color: #94a3b8;

<script type='text/javascript'>

    const urlParams = new URLSearchParams(window.location.search);
    const id = urlParams.get('id');
    const _console = urlParams.get('console');
    const file = `/emulatorJs/roms/${_console}/${urlParams.get('file')}`;
    const oldCores = urlParams.get('oldCores') == 0 ? false : true;

    EJS_player = '#game';
    EJS_core = _console.toLowerCase();
    EJS_oldCores = oldCores;
    EJS_gameUrl = file;
    EJS_pathtodata = '/emulatorJs/data/';
    EJS_gameID = id;
    EJS_language = 'pt-BR';
    EJS_startOnLoaded = true;

    const SUPABASE_URL = window.SUPABASE_URL || "https://zoyxotkqttuduioneezl.supabase.co";
    const SUPABASE_ANON_KEY = window.SUPABASE_ANON_KEY || "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InpveXhvdGtxdHR1ZHVpb25lZXpsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE1OTM3NTQsImV4cCI6MjA4NzE2OTc1NH0.cFh1cw-R6Mjf-sr4el4Bt4FPt5dFX66EQju9DUT-mTc";
    const SUPABASE_BUCKET = "saves";
    const SUPABASE_TABLE = "saves";

    let savePicker;
    let supabaseClient;

    const ensureSupabase = () => {
        if (supabaseClient) return supabaseClient;
        if (!window.supabase || !SUPABASE_URL.startsWith("https://") || SUPABASE_ANON_KEY === "YOUR-ANON-KEY") {
            console.error("Supabase não configurado. Defina SUPABASE_URL e SUPABASE_ANON_KEY.");
            return null;
        }
        const { createClient } = window.supabase;
        supabaseClient = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        return supabaseClient;
    };

    const USER_COOKIE = "gs_user_id";
    const getUserId = () => {
        const existing = document.cookie.split("; ").find(r => r.startsWith(`${USER_COOKIE}=`));
        if (existing) return existing.split("=")[1];
        const id = crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
        document.cookie = `${USER_COOKIE}=${id}; path=/; max-age=${60 * 60 * 24 * 400}`;
        return id;
    };

    const getDownloadUrl = (save) => {
        if (!save) return null;
        if (save.downloadUrl) return save.downloadUrl;
        if (save.fileUrl) return save.fileUrl;
        if (save.filename) return save.filename;
        if (save.id !== undefined && save.id !== null) return save.id;
        return null;
    };

    const ensureSavePicker = () => {
        if (savePicker) return savePicker;

        const overlay = document.createElement('div');
        overlay.className = 'save-modal-overlay';

        const modal = document.createElement('div');
        modal.className = 'save-modal';

        const header = document.createElement('header');
        const title = document.createElement('h3');
        title.textContent = 'Selecionar save';
        const closeBtn = document.createElement('button');
        closeBtn.setAttribute('aria-label', 'Fechar');
        closeBtn.innerHTML = '&times;';
        header.appendChild(title);
        header.appendChild(closeBtn);

        const content = document.createElement('div');
        content.className = 'content';

        const footer = document.createElement('div');
        footer.className = 'footer';
        const cancelBtn = document.createElement('button');
        cancelBtn.textContent = 'Cancelar';
        const reloadBtn = document.createElement('button');
        reloadBtn.textContent = 'Recarregar lista';
        reloadBtn.className = 'primary';
        footer.appendChild(cancelBtn);
        footer.appendChild(reloadBtn);

        modal.appendChild(header);
        modal.appendChild(content);
        modal.appendChild(footer);
        overlay.appendChild(modal);
        document.body.appendChild(overlay);

        savePicker = { overlay, modal, header, closeBtn, content, footer, cancelBtn, reloadBtn };
        return savePicker;
    };

    const setSaveList = (saves) => {
        const { content } = ensureSavePicker();
        content.innerHTML = '';

        if (!Array.isArray(saves) || saves.length === 0) {
            const empty = document.createElement('div');
            empty.className = 'save-empty';
            empty.textContent = 'Nenhum save encontrado.';
            content.appendChild(empty);
            return;
        }

        saves.forEach((save) => {
            const card = document.createElement('div');
            card.className = 'save-card';

            const meta = document.createElement('div');
            meta.className = 'meta';

            const title = document.createElement('div');
            title.className = 'title';
            title.textContent = save.name || save.filename || `Save #${save.id ?? ''}`;

            const subtitle = document.createElement('div');
            subtitle.className = 'subtitle';
            const createdAt = save.created_at || save.createdAt;
            const createdLabel = createdAt ? new Date(createdAt).toLocaleString('pt-BR') : 'Data não informada';
            subtitle.textContent = `Criado em ${createdLabel}`;

            meta.appendChild(title);
            meta.appendChild(subtitle);

            const badge = document.createElement('div');
            badge.className = 'badge';
            badge.textContent = save.console || save.system || 'Save state';

            card.appendChild(meta);
            card.appendChild(badge);

            card.addEventListener('click', () => {
                hideSavePicker(save);
            });

            content.appendChild(card);
        });
    };

    // Simple resolver store to keep functions without leaking
    const pendingResolvers = new Map();
    let resolverId = 0;

    const awaitSaveSelection = async () => {
        const picker = ensureSavePicker();
        picker.overlay.classList.add('open');

        picker.content.innerHTML = '<div class="save-loading">Carregando saves...</div>';

        const currentResolverId = (++resolverId).toString();

        const loadList = async () => {
            try {
                const supa = ensureSupabase();
                const userId = getUserId();
                if (!supa) throw new Error("Supabase não configurado.");

                const { data, error } = await supa
                    .from(SUPABASE_TABLE)
                    .select("id, name, game_id, user_id, created_at, state_path, screenshot_path, console, system")
                    .eq("game_id", EJS_gameID)
                    .eq("user_id", userId)
                    .order("created_at", { ascending: false });
                if (error) throw error;

                const savesWithUrls = await Promise.all((data || []).map(async (row) => {
                    const { data: signedState } = await supa
                        .storage
                        .from(SUPABASE_BUCKET)
                        .createSignedUrl(row.state_path, 60 * 5);
                    let screenshotUrl = null;
                    if (row.screenshot_path) {
                        const { data: signedShot } = await supa
                            .storage
                            .from(SUPABASE_BUCKET)
                            .createSignedUrl(row.screenshot_path, 60 * 5);
                        screenshotUrl = signedShot?.signedUrl || null;
                    }
                    return {
                        ...row,
                        downloadUrl: signedState?.signedUrl || null,
                        screenshotUrl,
                    };
                }));

                const saves = savesWithUrls;
                setSaveList(saves);
            } catch (error) {
                console.error('Erro ao listar saves:', error);
                picker.content.innerHTML = '<div class="save-empty">Erro ao carregar lista de saves.</div>';
            }
        };

        picker.reloadBtn.onclick = loadList;
        picker.closeBtn.onclick = () => hideSavePicker(null, currentResolverId);
        picker.cancelBtn.onclick = () => hideSavePicker(null, currentResolverId);

        await loadList();

        return new Promise((resolve) => {
            pendingResolvers.set(currentResolverId, resolve);
            picker.overlay.dataset.resolverId = currentResolverId;
        });
    };

    const hideSavePicker = (selected, id) => {
        if (!savePicker) return;
        const { overlay } = savePicker;
        overlay.classList.remove('open');

        const resolverKey = id || overlay.dataset.resolverId;
        const resolveFn = pendingResolvers.get(resolverKey);
        pendingResolvers.delete(resolverKey);
        overlay.dataset.resolverId = '';
        if (resolveFn) resolveFn(selected || null);
    };

    // Salvar state no backend
    EJS_onSaveState = function (data) {
        const supa = ensureSupabase();
        const userId = getUserId();
        const gameId = EJS_gameID || _console;

        if (!supa) {
            console.error("Supabase não configurado. Save não enviado.");
            return;
        }

        let stateBlob = new Blob([data.state], { type: "application/octet-stream" });
        let screenshotBlob = new Blob([data.screenshot], { type: "image/png" });

        const timestamp = new Date().toISOString().replace(/[:.]/g, "-");
        const basePath = `${userId}/${gameId}/${timestamp}`;
        const statePath = `${basePath}.state`;
        const screenshotPath = `${basePath}.png`;

        (async () => {
            try {
                const { error: upErr } = await supa.storage
                    .from(SUPABASE_BUCKET)
                    .upload(statePath, stateBlob, {
                        contentType: "application/octet-stream",
                        upsert: true
                    });
                if (upErr) throw upErr;

                const { error: shotErr } = await supa.storage
                    .from(SUPABASE_BUCKET)
                    .upload(screenshotPath, screenshotBlob, {
                        contentType: "image/png",
                        upsert: true
                    });
                if (shotErr) throw shotErr;

                const { error: dbErr } = await supa
                    .from(SUPABASE_TABLE)
                    .insert({
                        game_id: gameId,
                        user_id: userId,
                        name: `Save ${new Date().toLocaleString('pt-BR')}`,
                        state_path: statePath,
                        screenshot_path: screenshotPath,
                        console: _console,
                        system: _console
                    });
                if (dbErr) throw dbErr;

                console.log("Save enviado para Supabase com sucesso.");
            } catch (error) {
                console.error("Erro ao salvar no Supabase:", error?.message || error);
                alert(`Erro ao salvar no Supabase: ${error?.message || error}`);
            }
        })();
    };

    // EJS_loadStateURL = 'http://localhost/api/v1/load';

    // EJS_onLoadState = function loadStateFromServer(filename) {
    //     console.log(filename);
    //     fetch(`http://localhost/api/v1/load`)
    //         // .then(response => response.blob())
    //         .then(blob => {
    //             // EmulatorJS.loadState(blob);
    //             let arrayBuffer = blob.arrayBuffer();

    //             // Carrega o save state no EmulatorJS
    //             window.EJS_emulator.loadState(new Uint8Array(arrayBuffer));
    //         })
    //         .catch(error => {
    //             console.error("Erro ao carregar save state:", error);
    //         });
    // };

    EJS_onGameStart = function () {
        window.EJS_emulator.on("loadState", async function () {
            try {
                const selected = await awaitSaveSelection();
                if (!selected) {
                    console.log('Carregamento de save cancelado pelo usuário.');
                    return;
                }

                const downloadUrl = getDownloadUrl(selected);
                if (!downloadUrl) {
                    console.error('Não foi possível determinar a URL do save selecionado.');
                    return;
                }

                const response = await fetch(downloadUrl);
                if (!response.ok) throw new Error(`Erro ao baixar save (${response.status})`);
                const buffer = await response.arrayBuffer();

                setTimeout(() => {
                    window.EJS_emulator.gameManager.functions.loadState(new Uint8Array(buffer));
                }, 10);
            } catch (error) {
                console.error('Erro ao carregar save state:', error);
            }
        });
    };

    // EJS_onGameStart = function () {
    //     // console.log("Jogo carregado, tentando carregar save...");
    //     // EmulatorJS = window.EJS_emulator;
    //     // EJS_onLoadState("save.state");

    //     window.EJS_emulator.on("loadState", function loadStateFromServer(filename) {
    //         console.log(filename);
    //         fetch(`http://localhost/api/v1/load`)
    //             // .then(response => response.blob())
    //             .then(blob => {
    //                 // EmulatorJS.loadState(blob);
    //                 let arrayBuffer = blob.arrayBuffer();

    //                 // Carrega o save state no EmulatorJS
    //                 window.EJS_emulator.loadState(new Uint8Array(arrayBuffer));
    //             })
    //             .catch(error => {
    //                 console.error("Erro ao carregar save state:", error);
    //             });
    //     });

    // };

    EJS_color = "#FFA500";
    // EJS_Settings = {
    //     defaultControllers: { '0': { '0': { 'value': '90' }, '1': { 'value': '83' }, '2': { 'value': '16' }, '3': { 'value': '13' }, '4': { 'value': '38' }, '5': { 'value': '40' }, '6': { 'value': '37' }, '7': { 'value': '39' }, '8': { 'value': '88' }, '9': { 'value': '65' }, '10': { 'value': '81', 'value2': '4' } }, '1': {}, '2': {}, '3': {} }
    // }
    // EJS_pathtodata = "https://rawcdn.githack.com/EmulatorJS/EmulatorJS/main/data/";
    EJS_lightgun = false; 		// Lightgun
    // EJS_oldCores = true;
    EJS_defaultOptions = {
        'save-state-location': 'keep in browser'
    }
</script>
